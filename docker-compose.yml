services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URI: ${DATABASE_URI}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:-jNYrMbKAgyxr8LVvK2sNo12weg7XdSDp}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://mosaik-ruesselsheim.de}
        CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-xosgweuf}
        CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-658575442766399}
        CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-wk-HNCdiPqJPbFRs0DIGdW0bS2M}
    container_name: mosaik_app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URI=${DATABASE_URI}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-jNYrMbKAgyxr8LVvK2sNo12weg7XdSDp}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-https://mosaik-ruesselsheim.de}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-xosgweuf}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-658575442766399}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-wk-HNCdiPqJPbFRs0DIGdW0bS2M}
    # Hem host'taki hem de docker ağındaki PostgreSQL'e erişimi kolaylaştırır:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network

networks:
  app_network:
    name: ${DOCKER_NETWORK:-coolify}
    external: true
